name: Build and Publish Docker image

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # always pull the base image so its security fixes land on every rebuild
          pull: true
          # the server pulls `latest`; `master-<sha>` allows going back to a build
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/senpir-back:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/senpir-back:master-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
